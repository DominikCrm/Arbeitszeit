<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Arbeitszeiten & Gehaltsrechner</title>

<style>
:root {
  --bg: #0f172a;
  --card: #1e293b;
  --text: #e5e7eb;
  --muted: #94a3b8;
  --accent: #38bdf8;
  --danger: #ef4444;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  padding: 16px;
}

.container {
  max-width: 1100px;
  margin: auto;
}

h1, h2 {
  margin: 8px 0;
}

.card {
  background: var(--card);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 16px;
  box-shadow: 0 10px 30px rgba(0,0,0,.35);
}

.flex {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: end;
}

.table-wrapper {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 700px;
}

th, td {
  padding: 10px;
  text-align: center;
}

th {
  color: var(--muted);
  font-weight: 500;
}

tr:not(:last-child) {
  border-bottom: 1px solid #334155;
}

input, select {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  border: none;
  background: #020617;
  color: var(--text);
  font-size: 1em;
}

button {
  padding: 10px 12px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  font-weight: 600;
  font-size: .95em;
}

button:hover {
  opacity: .85;
}

button:disabled {
  opacity: .4;
  cursor: not-allowed;
}

.primary {
  background: var(--accent);
  color: #020617;
}

.secondary {
  background: #334155;
  color: var(--text);
}

.danger {
  background: var(--danger);
  color: white;
}

.delete {
  background: #f59e0b;
  color: white;
}

.salary {
  font-weight: 700;
  color: var(--accent);
}

.summary p {
  font-size: 1.1em;
  margin: 6px 0;
}

#user-bar {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}

.extra-field {
  flex: 1;
  min-width: 150px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

/* Kalenderfelder */

.calendar-wrapper {
  display: flex;
  align-items: center;
  gap: 5px;
  width: 100%;
}

.calendar-wrapper input {
  min-width: 0;
  flex: 1;
}

.calendar-btn {
  background: #334155;
  color: white;
  padding: 9px;
  min-width: 38px;
  height: 40px;
  font-size: 17px;
  flex-shrink: 0;
}

.month-field {
  flex: 1;
  min-width: 180px;
}

.date-wrapper {
  display: flex;
  align-items: center;
  gap: 5px;
}

.date-wrapper input {
  min-width: 120px;
}

#user-info {
  font-size: .9em;
  color: var(--muted);
}

.status {
  color: var(--muted);
  font-size: .85em;
  margin-top: 8px;
}

@media(max-width:700px) {
  h1 {
    font-size: 1.4em;
  }

  table {
    font-size: .9em;
  }

  .flex > button {
    flex: 1;
  }
}
</style>
</head>

<body>

<div class="container">

<h1>🗓️ Arbeitszeiten & Gehaltsrechner</h1>

<!-- LOGIN -->

<div class="card" id="user-bar">

  <button class="secondary" id="login-google">
    Mit Google anmelden
  </button>

  <button class="secondary" id="login-apple">
    Mit Apple anmelden
  </button>

  <button class="danger" id="logout" style="display:none">
    Abmelden
  </button>

  <span id="user-info"></span>

</div>


<!-- MONATSSTEUERUNG -->

<div class="card flex">

  <div class="month-field">

    <label>Abrechnungsmonat</label>

    <div class="calendar-wrapper">

      <input
        type="month"
        id="month"
      >

      <button
        type="button"
        class="calendar-btn"
        id="monthCalendarBtn"
        title="Monat auswählen"
      >📅</button>

    </div>

  </div>


  <div class="extra-field">

    <label>Sonstiges (€)</label>

    <input
      type="number"
      id="extraAmount"
      min="0"
      step="0.01"
      value="0"
    >

  </div>


  <button class="primary" id="saveBtn">
    💾 Speichern
  </button>


  <select id="savedMonths">

    <option value="">
      📂 Gespeicherte Monate
    </option>

  </select>


  <button
    class="delete"
    id="deleteMonth"
    disabled
  >
    🗑️ Monat löschen
  </button>

</div>


<!-- SCHICHTEN -->

<div class="card">

  <div class="table-wrapper">

    <table>

      <thead>

        <tr>
          <th>Datum</th>
          <th>Schicht</th>
          <th>Paletten</th>
          <th>€</th>
          <th></th>
        </tr>

      </thead>

      <tbody id="tbody"></tbody>

    </table>

  </div>

  <br>

  <button class="primary" id="addRowBtn">
    ➕ Schicht hinzufügen
  </button>

  <div class="status" id="monthStatus"></div>

</div>


<!-- MONATSÜBERSICHT -->

<div class="card summary">

  <h2>📊 Monatsübersicht</h2>

  <p>
    Schichten gesamt:
    <span id="totalShifts">0</span>
  </p>

  <p>
    Schicht-Gehalt:
    <span id="shiftSalary">0,00 €</span>
  </p>

  <p>
    <strong>
      Gesamt (inkl. sonstiges):
      <span id="totalSalary">0,00 €</span>
    </strong>
  </p>

</div>


<!-- JAHRESÜBERSICHT -->

<div class="card summary">

  <h2>📅 Jahresübersicht</h2>

  <p>
    Schichten Jahr:
    <span id="yearShifts">0</span>
  </p>

  <p>
    Gehalt Jahr:
    <span id="yearSalary">0,00 €</span>
  </p>

</div>

</div>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


<script>

// ========================================
// FIREBASE CONFIG
// ========================================

const firebaseConfig = {
  apiKey: "AIzaSyBkOZNvEpg0OcBkffwtyDm-ar6VAeucYFk",
  authDomain: "arbeitszeit-c3243.firebaseapp.com",
  projectId: "arbeitszeit-c3243",
  storageBucket: "arbeitszeit-c3243.firebasestorage.app",
  messagingSenderId: "8215248023",
  appId: "1:8215248023:web:cf7465987b5cdfa36fbdd2"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();


// ========================================
// DOM
// ========================================

const tbody = document.getElementById("tbody");

const monthInput = document.getElementById("month");
const extraAmount = document.getElementById("extraAmount");

const savedMonths = document.getElementById("savedMonths");

const deleteMonthBtn = document.getElementById("deleteMonth");

const monthStatus = document.getElementById("monthStatus");

const totalSalary = document.getElementById("totalSalary");
const shiftSalary = document.getElementById("shiftSalary");
const totalShifts = document.getElementById("totalShifts");

const yearSalary = document.getElementById("yearSalary");
const yearShifts = document.getElementById("yearShifts");

const loginGoogle = document.getElementById("login-google");
const loginApple = document.getElementById("login-apple");
const logoutBtn = document.getElementById("logout");

const userInfoSpan = document.getElementById("user-info");


// ========================================
// HILFSFUNKTIONEN
// ========================================

function money(value) {
  return Number(value || 0).toLocaleString("de-DE", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  }) + " €";
}


function currentBillingMonth() {

  const now = new Date();

  let year = now.getFullYear();
  let month = now.getMonth() + 1;

  // Ab dem 21. beginnt der nächste Abrechnungsmonat

  if (now.getDate() >= 21) {

    month++;

    if (month > 12) {
      month = 1;
      year++;
    }

  }

  return `${year}-${String(month).padStart(2, "0")}`;

}


function getBillingPeriod(monthValue) {

  const [year, month] = monthValue.split("-").map(Number);

  const start = new Date(year, month - 2, 21);
  const end = new Date(year, month - 1, 20);

  return {
    start: formatDate(start),
    end: formatDate(end)
  };

}


function formatDate(date) {

  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");

  return `${y}-${m}-${d}`;

}


// ========================================
// LOGIN
// ========================================

loginGoogle.onclick = async () => {

  const provider = new firebase.auth.GoogleAuthProvider();

  try {
    await auth.signInWithPopup(provider);
  } catch (error) {
    console.error(error);
    alert("Google-Anmeldung fehlgeschlagen.");
  }

};


loginApple.onclick = async () => {

  const provider = new firebase.auth.OAuthProvider("apple.com");

  provider.addScope("email");
  provider.addScope("name");

  try {
    await auth.signInWithPopup(provider);
  } catch (error) {
    console.error(error);
    alert("Apple-Anmeldung fehlgeschlagen.");
  }

};


logoutBtn.onclick = () => auth.signOut();


// ========================================
// AUTH STATUS
// ========================================

auth.onAuthStateChanged(async user => {

  if (!user) {

    userInfoSpan.textContent = "";

    loginGoogle.style.display = "inline-block";
    loginApple.style.display = "inline-block";

    logoutBtn.style.display = "none";

    deleteMonthBtn.disabled = true;

    tbody.innerHTML = "";

    extraAmount.value = "0";

    updateSummary(0, 0, 0);

    yearSalary.textContent = money(0);
    yearShifts.textContent = "0";

    return;

  }


  userInfoSpan.textContent =
    user.email || user.displayName || user.uid;

  loginGoogle.style.display = "none";
  loginApple.style.display = "none";

  logoutBtn.style.display = "inline-block";


  // Gespeicherte Monate laden

  await loadMonthListFromFirestore();


  // Aktuellen Abrechnungsmonat einstellen

  monthInput.value = currentBillingMonth();


  // Aktuellen Monat aus Firebase laden

  await loadMonth(monthInput.value);


  // Jahresübersicht aktualisieren

  await calculateYear();

});


// ========================================
// KALENDERBUTTONS
// ========================================

document.getElementById("monthCalendarBtn").onclick = () => {

  if (monthInput.showPicker) {
    monthInput.showPicker();
  } else {
    monthInput.focus();
  }

};


// ========================================
// SCHICHTEN
// ========================================

function addRow(data = {}) {

  const tr = document.createElement("tr");


  const dateTd = document.createElement("td");

  const dateWrapper = document.createElement("div");

  dateWrapper.className = "date-wrapper";


  const dateInput = document.createElement("input");

  dateInput.type = "date";
  dateInput.value = data.date || "";


  const calendarBtn = document.createElement("button");

  calendarBtn.type = "button";
  calendarBtn.className = "calendar-btn";
  calendarBtn.textContent = "📅";
  calendarBtn.title = "Datum auswählen";


  calendarBtn.onclick = () => {

    if (dateInput.showPicker) {
      dateInput.showPicker();
    } else {
      dateInput.focus();
    }

  };


  dateWrapper.appendChild(dateInput);
  dateWrapper.appendChild(calendarBtn);

  dateTd.appendChild(dateWrapper);


  const typeTd = document.createElement("td");

  const typeSelect = document.createElement("select");

  typeSelect.innerHTML = `
    <option value="">Bitte auswählen</option>
    <option value="normal">normal</option>
    <option value="doppel">doppel</option>
    <option value="extra">extra</option>
  `;

  typeSelect.value = data.type || "";

  typeTd.appendChild(typeSelect);


  const palletTd = document.createElement("td");

  const palletInput = document.createElement("input");

  palletInput.type = "number";
  palletInput.min = "0";
  palletInput.value = data.pallets ?? "";

  palletTd.appendChild(palletInput);


  const salaryTd = document.createElement("td");

  salaryTd.className = "salary";
  salaryTd.textContent = money(0);


  const deleteTd = document.createElement("td");

  const deleteBtn = document.createElement("button");

  deleteBtn.className = "danger";
  deleteBtn.textContent = "✖";

  deleteBtn.onclick = () => {

    tr.remove();

    calculateAll();

  };

  deleteTd.appendChild(deleteBtn);


  tr.appendChild(dateTd);
  tr.appendChild(typeTd);
  tr.appendChild(palletTd);
  tr.appendChild(salaryTd);
  tr.appendChild(deleteTd);


  [dateInput, typeSelect, palletInput].forEach(element => {

    element.addEventListener("input", calculateAll);
    element.addEventListener("change", calculateAll);

  });


  tbody.appendChild(tr);

  calculateAll();

}


// ========================================
// GEHALTSBERECHNUNG
// ========================================

function round5(value) {

  return Math.ceil(value / 5) * 5;

}


function calc(type, pallets) {

  // Normale Schicht

  if (type === "normal") {
    return 60;
  }

  // Doppelschicht

  if (type === "doppel") {
    return 120;
  }

  // Extraschicht

  if (type === "extra") {

    return round5(
      60 + Math.max(0, pallets - 17) * 3.3
    );

  }

  return 0;

}


// ========================================
// MONATSBERECHNUNG
// ========================================

function calculateAll() {

  if (!monthInput.value) {

    updateSummary(0, 0, 0);

    return;

  }

  const period = getBillingPeriod(monthInput.value);

  let sum = 0;
  let count = 0;


  [...tbody.children].forEach(row => {

    const date = row.children[0]
      .querySelector('input[type="date"]').value;

    const type = row.children[1]
      .querySelector("select").value;

    const pallets = Number(
      row.children[2].querySelector("input").value
    ) || 0;


    let salary = 0;

    if (
      date &&
      date >= period.start &&
      date <= period.end &&
      type
    ) {

      salary = calc(type, pallets);

      sum += salary;

      count++;

    }


    row.querySelector(".salary").textContent = money(salary);

  });


  const extra = Number(extraAmount.value) || 0;

  updateSummary(sum, count, sum + extra);

}


function updateSummary(sum, count, total) {

  shiftSalary.textContent = money(sum);

  totalSalary.textContent = money(total);

  totalShifts.textContent = count;

}


extraAmount.addEventListener("input", calculateAll);


// ========================================
// MONAT LADEN
// ========================================

async function loadMonth(monthId) {

  const user = auth.currentUser;

  if (!user || !monthId) return;


  tbody.innerHTML = "";

  extraAmount.value = "0";

  deleteMonthBtn.disabled = true;

  savedMonths.value = "";


  try {

    const doc = await db.collection("users")
      .doc(user.uid)
      .collection("months")
      .doc(monthId)
      .get();


    monthInput.value = monthId;


    if (doc.exists) {

      const data = doc.data();

      extraAmount.value = data.extraAmount ?? 0;

      (data.rows || []).forEach(addRow);

      deleteMonthBtn.disabled = false;

      monthStatus.textContent =
        "✅ Gespeicherter Monat geladen.";

    } else {

      monthStatus.textContent =
        "ℹ️ Noch keine gespeicherten Daten für diesen Monat.";

    }


    // Mindestens fünf Eingabezeilen

    while (tbody.children.length < 5) {
      addRow();
    }


    calculateAll();


  } catch (error) {

    console.error(error);

    monthStatus.textContent =
      "❌ Fehler beim Laden des Monats.";

  }

}


// ========================================
// MONATSAUSWAHL
// ========================================

monthInput.addEventListener("change", async () => {

  if (!monthInput.value) return;

  if (auth.currentUser) {

    await loadMonth(monthInput.value);

  } else {

    calculateAll();

  }

});


savedMonths.addEventListener("change", async () => {

  const selected = savedMonths.value;

  if (!selected) {

    deleteMonthBtn.disabled = true;

    return;

  }

  await loadMonth(selected);

});


// ========================================
// MONAT SPEICHERN
// ========================================

async function saveMonth() {

  const user = auth.currentUser;

  if (!user) {

    alert("Bitte zuerst anmelden!");

    return;

  }

  if (!monthInput.value) {

    alert("Bitte einen Abrechnungsmonat auswählen!");

    return;

  }


  const period = getBillingPeriod(monthInput.value);


  const rows = [...tbody.children].map(row => {

    const date = row.children[0]
      .querySelector('input[type="date"]').value;

    const type = row.children[1]
      .querySelector("select").value;

    const pallets = row.children[2]
      .querySelector("input").value;


    if (!date || !type) return null;

    if (date < period.start || date > period.end) return null;


    return {
      date,
      type,
      pallets
    };

  }).filter(Boolean);


  const extra = Number(extraAmount.value) || 0;


  const shiftTotal = rows.reduce((sum, row) => {

    return sum + calc(row.type, Number(row.pallets) || 0);

  }, 0);


  try {

    await db.collection("users")
      .doc(user.uid)
      .collection("months")
      .doc(monthInput.value)
      .set({

        rows,

        extraAmount: extra,

        count: rows.length,

        shiftTotal,

        total: shiftTotal + extra,

        updated: firebase.firestore.FieldValue.serverTimestamp()

      });


    await loadMonthListFromFirestore();

    await calculateYear();


    savedMonths.value = monthInput.value;

    deleteMonthBtn.disabled = false;

    monthStatus.textContent =
      "✅ Änderungen erfolgreich gespeichert.";

    alert("Monat erfolgreich gespeichert!");


  } catch (error) {

    console.error(error);

    alert("Fehler beim Speichern des Monats!");

  }

}


// ========================================
// MONAT LÖSCHEN
// ========================================

deleteMonthBtn.onclick = async () => {

  const user = auth.currentUser;

  const selectedMonth = savedMonths.value;


  if (!user || !selectedMonth) {

    alert("Bitte zuerst einen gespeicherten Monat auswählen.");

    return;

  }


  const confirmed = confirm(

    `Möchtest du den Monat ${selectedMonth} wirklich vollständig löschen?\n\n` +

    "Alle gespeicherten Schichten und Gehaltsdaten werden unwiderruflich entfernt."

  );


  if (!confirmed) return;


  try {

    await db.collection("users")
      .doc(user.uid)
      .collection("months")
      .doc(selectedMonth)
      .delete();


    // Auswahl zurücksetzen

    savedMonths.value = "";

    deleteMonthBtn.disabled = true;


    // Monat leeren

    tbody.innerHTML = "";

    extraAmount.value = "0";

    monthInput.value = "";


    for (let i = 0; i < 5; i++) {
      addRow();
    }


    // Übersichten aktualisieren

    calculateAll();

    await loadMonthListFromFirestore();

    await calculateYear();


    monthStatus.textContent =
      `🗑️ Monat ${selectedMonth} wurde gelöscht.`;


    alert(`Monat ${selectedMonth} wurde vollständig gelöscht!`);


  } catch (error) {

    console.error(error);

    alert("Fehler beim Löschen des Monats!");

  }

};


// ========================================
// GESPEICHERTE MONATE LADEN
// ========================================

async function loadMonthListFromFirestore() {

  const user = auth.currentUser;

  if (!user) return;


  savedMonths.innerHTML = `
    <option value="">
      📂 Gespeicherte Monate
    </option>
  `;


  const snap = await db.collection("users")
    .doc(user.uid)
    .collection("months")
    .orderBy("updated", "desc")
    .get();


  snap.forEach(doc => {

    const data = doc.data();

    const option = document.createElement("option");

    option.value = doc.id;

    option.textContent =
      `${doc.id} (${data.count || 0} Schichten, ${money(data.total)})`;

    savedMonths.appendChild(option);

  });

}


// ========================================
// JAHRESÜBERSICHT
// ========================================

async function calculateYear() {

  const user = auth.currentUser;

  if (!user) return;


  let sum = 0;

  let count = 0;


  const snap = await db.collection("users")
    .doc(user.uid)
    .collection("months")
    .get();


  snap.forEach(doc => {

    const data = doc.data();

    sum += Number(data.total) || 0;

    count += Number(data.count) || 0;

  });


  yearSalary.textContent = money(sum);

  yearShifts.textContent = count;

}


// ========================================
// BUTTONS
// ========================================

document.getElementById("saveBtn").onclick = saveMonth;

document.getElementById("addRowBtn").onclick = () => addRow();


// ========================================
// INITIALISIERUNG
// ========================================

// Die Monatsauswahl erfolgt nach erfolgreicher Anmeldung.
// Ohne Anmeldung wird zumindest der aktuelle Monat angezeigt.

monthInput.value = currentBillingMonth();

for (let i = 0; i < 5; i++) {
  addRow();
}

</script>

</body>
</html>
